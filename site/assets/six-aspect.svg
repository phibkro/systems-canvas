<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-labelledby="six-title six-desc"><title id="six-title">System Canvas: six interconnected aspects</title><desc id="six-desc">Authority and Purpose are above; Structure, Behavior and Outcomes form the central thread; Knowledge below receives evidence and returns learning. Distinct arrows show enabling, directing and feedback.</desc><defs><linearGradient id="six-bg" x2="1" y2="1"><stop stop-color="#091a1e"/><stop offset="1" stop-color="#10292c"/></linearGradient><marker id="six-mint" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#75dbb7" stroke-width="2"/></marker><marker id="six-blue" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a7cbf9" stroke-width="2"/></marker><marker id="six-gold" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#e8c785" stroke-width="2"/></marker><marker id="six-violet" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#d1a9f2" stroke-width="2"/></marker><style>text{font-family:Inter,system-ui,Arial,sans-serif}.h{font-size:34px;fill:#f0faf7;font-weight:750}.sub{font-size:15px;fill:#acc6c1}.tag{font-size:12px;letter-spacing:1.6px;font-weight:700}.name{font-size:26px;font-weight:750;fill:#f9fffd}.detail{font-size:15px;fill:#cbdcd8}.path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.legend{font-size:12px;fill:#b7cfca}</style></defs>
<rect width="1200" height="810" rx="22" fill="url(#six-bg)"/><text x="45" y="64" class="h">System Canvas</text><text x="325" y="64" class="sub">Six analytical aspects · one connected system</text><path d="M44 101H1155" stroke="#39565a"/><text x="48" y="128" fill="#9bb9b1" font-size="12" letter-spacing="1.1">A SPATIAL GRAMMAR · RELATIONSHIPS MUST BE EVIDENCED</text>
