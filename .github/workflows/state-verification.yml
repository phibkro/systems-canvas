name: Canvas state verification
on:
  push:
    branches: [main]
    paths:
      - "site/system-canvas-state.ts"
      - "site/system-canvas-interactions.js"
      - "tests/**"
      - "package.json"
      - "stryker.config.mjs"
      - ".github/workflows/state-verification.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
  mutation-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
